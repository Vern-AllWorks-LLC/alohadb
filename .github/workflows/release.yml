name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v20.1.0); also used in archive names'
        required: true
      publish:
        description: 'Upload to the GitHub Release (false = build artifacts only)'
        type: boolean
        default: false

permissions:
  contents: write

# Python runtime bundled into the Linux/macOS packages for PL/Python and
# alohadb_python (relocatable CPython builds from python-build-standalone).
env:
  PBS_RELEASE: '20261026'
  PBS_PYTHON: '3.12.16'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            pytriple: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
            pytriple: aarch64-unknown-linux-gnu
          - os: macos-latest
            platform: macos-arm64
            pytriple: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x86_64
            pytriple: x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64

    steps:
      # Keep LF line endings on Windows: the Perl code generators
      # (e.g. generate-lwlocknames.pl) cannot parse CRLF input.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # ---- Linux dependencies -----------------------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            libreadline-dev libssl-dev libzstd-dev liblz4-dev \
            zlib1g-dev libicu-dev libcurl4-openssl-dev \
            python3 python3-pip bison flex patchelf file
          # Ubuntu 22.04's meson (0.61) cannot introspect Python 3.12 (no distutils).
          sudo pip3 install meson==1.5.2
          hash -r; meson --version

      # ---- macOS dependencies -----------------------------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja pkg-config \
            readline openssl zstd lz4 icu4c curl \
            bison flex dylibbundler
          # Brew bison/flex are newer than the system versions; put them first
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin"  >> $GITHUB_PATH

      # ---- Windows dependencies (MSYS2/MinGW64) -----------------------------
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-curl-winssl
            mingw-w64-x86_64-python
            bison
            perl
            flex
            zip
            unzip

      # ---- Bundled Python (Linux / macOS) -----------------------------------
      - name: Fetch bundled Python (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          F="cpython-${PBS_PYTHON}+${PBS_RELEASE}-${{ matrix.pytriple }}-install_only_stripped.tar.gz"
          U="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$U/$F"
          curl -fsSL "$U/SHA256SUMS" -o SHA256SUMS
          grep " $F\$" SHA256SUMS | shasum -a 256 -c -
          tar -xzf "$F"
          PYROOT="$RUNNER_TEMP/python"
          # Point the pkg-config files at the unpacked location (they say /install).
          for pc in "$PYROOT"/lib/pkgconfig/*.pc; do
            sed -i.bak "s|^prefix=.*|prefix=$PYROOT|" "$pc" && rm -f "$pc.bak"
          done
          "$PYROOT/bin/python3" -VV
          ls "$PYROOT/lib" | grep -i libpython
          echo "PYROOT=$PYROOT" >> "$GITHUB_ENV"

      # ---- Build: Linux / macOS ---------------------------------------------
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          # macOS: help pkg-config find brew-installed libraries
          if [ "$(uname -s)" = "Darwin" ]; then
            export PKG_CONFIG_PATH="\
          $(brew --prefix openssl)/lib/pkgconfig:\
          $(brew --prefix icu4c)/lib/pkgconfig:\
          $(brew --prefix readline)/lib/pkgconfig:\
          $(brew --prefix zstd)/lib/pkgconfig:\
          $(brew --prefix lz4)/lib/pkgconfig:\
          $(brew --prefix curl)/lib/pkgconfig:\
          ${PKG_CONFIG_PATH:-}"
          fi
          export PKG_CONFIG_PATH="$PYROOT/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          meson setup builddir \
            --prefix=/usr/local/alohadb \
            --libdir=lib \
            -Drpath=true \
            -Dssl=openssl \
            -Dplpython=enabled \
            -DPYTHON="$PYROOT/bin/python3"

      - name: Compile (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)
          ninja -C builddir -j"$JOBS"

      # The package is relocatable: it unpacks to one alohadb-<ver>-<platform>/
      # directory, carries its third-party shared libraries, and finds them
      # relative to its own location (no /usr/local/alohadb, no Homebrew).
      - name: Stage & package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          DESTDIR="$PWD/stage" ninja -C builddir install
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="alohadb-${VERSION}-${{ matrix.platform }}"
          mkdir -p dist
          mv stage/usr/local/alohadb "dist/$NAME"
          P="$PWD/dist/$NAME"
          # PL/Python finds this runtime at <install>/python (see plpy_main.c).
          cp -a "$PYROOT" "$P/python"

          if [ "$(uname -s)" = "Linux" ]; then
            # Bundle every non-glibc dependency, then use $ORIGIN runpaths.
            find "$P/bin" "$P/lib" -type f | while read -r f; do
              file -b "$f" | grep -q '^ELF' || continue
              LD_LIBRARY_PATH="$P/lib:$P/python/lib" ldd "$f" | awk '$3 ~ /^\// {print $3}'
            done | sort -u | while read -r lib; do
              case "$(basename "$lib")" in
                libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|ld-linux*|libresolv.so*|libutil.so*|libgcc_s.so*) continue ;;
              esac
              case "$lib" in "$P"/*|"$PYROOT"/*) continue ;; esac
              cp -nL "$lib" "$P/lib/"
            done
            find "$P/bin" -type f | while read -r f; do
              if file -b "$f" | grep -q '^ELF'; then patchelf --set-rpath '$ORIGIN/../lib' "$f"; fi
            done
            find "$P/lib" -maxdepth 1 -type f -name '*.so*' | while read -r f; do
              if file -b "$f" | grep -q '^ELF'; then patchelf --set-rpath '$ORIGIN:$ORIGIN/../python/lib' "$f"; fi
            done
          else
            # Copy Homebrew dylibs into lib/bundled and rewrite references.
            args=()
            pymods=()
            while IFS= read -r f; do
              file -b "$f" | grep -q 'Mach-O' || continue
              if otool -L "$f" | grep -q 'libpython'; then pymods+=("$f"); else args+=(-x "$f"); fi
            done < <(find "$P/bin" "$P/lib" -type f)
            # PL/Python modules: load libpython from the bundled python/ directory.
            for f in "${pymods[@]}"; do
              otool -L "$f" | awk 'NR>1 {print $1}' | grep libpython | while read -r dep; do
                install_name_tool -change "$dep" "@loader_path/../python/lib/$(basename "$dep")" "$f"
              done
              otool -L "$f"
            done
            # Our own libraries (libpq, ...) are handled below, not bundled.
            dylibbundler -of -cd -b -i /usr/local/alohadb/lib/ "${args[@]}" \
              -d "$P/lib/bundled" -p @executable_path/../lib/bundled/
            # Own libraries: absolute /usr/local/alohadb/lib install names -> @rpath,
            # resolved relative to the executable or loading library.
            find "$P/bin" "$P/lib" -type f | while read -r f; do
              file -b "$f" | grep -q 'Mach-O' || continue
              case "$f" in "$P"/lib/*.dylib) install_name_tool -id "@rpath/$(basename "$f")" "$f" 2>/dev/null || true ;; esac
              { otool -L "$f" | awk 'NR>1 {print $1}' | grep '^/usr/local/alohadb/lib/' || true; } | while read -r dep; do
                install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$f"
              done
              install_name_tool -delete_rpath /usr/local/alohadb/lib "$f" 2>/dev/null || true
              case "$f" in
                "$P"/bin/*) install_name_tool -add_rpath @executable_path/../lib "$f" 2>/dev/null || true ;;
                *)          install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true ;;
              esac
            done
            find "$P" -path "$P/python" -prune -o -type f -print | while read -r f; do
              if file -b "$f" | grep -q 'Mach-O'; then codesign --force -s - "$f" 2>/dev/null || true; fi
            done
          fi

          ARCHIVE="${NAME}.tar.gz"
          tar -czf "$ARCHIVE" -C dist "$NAME"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "PKGNAME=$NAME" >> $GITHUB_ENV

      - name: Smoke-test package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          tar -xzf "$ARCHIVE" -C "$T"
          B="$T/$PKGNAME/bin"
          # No dependency may point outside the package (except the OS libraries).
          if [ "$(uname -s)" = "Linux" ]; then
            bad=$(ldd "$B/alohadb" "$B/alsql" "$T/$PKGNAME/lib/plpython3.so" | awk '$3 ~ /^\// {print $3}' | grep -v "^$T/" \
                  | grep -vE '/(libc|libm|libdl|libpthread|librt|libresolv|libutil|libgcc_s)\.so|/ld-linux' || true)
          else
            bad=$(otool -L "$B/alohadb" "$B/alsql" "$T/$PKGNAME/lib/plpython3.so" \
                  | grep -E '/opt/homebrew|/usr/local/|/install/|'"$RUNNER_TEMP" || true)
          fi
          if [ -n "$bad" ]; then echo "Unbundled dependencies:"; echo "$bad"; exit 1; fi
          "$B/alinitdb" -D "$T/data" -A trust -U ci --no-instructions
          "$B/al_ctl" -D "$T/data" -l "$T/server.log" -o "-p 54329 -k $T" -w start || { cat "$T/server.log"; exit 1; }
          "$B/alsql" -X -h "$T" -p 54329 -U ci -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT version()" \
            -c "CREATE EXTENSION alohadb_pg19compat" \
            -c "CREATE EXTENSION alohadb_vector" \
            -c "SELECT '[3,4]'::vector <-> '[0,0]'::vector AS l2" \
            -c "CREATE EXTENSION alohadb_python CASCADE" \
            -c "SELECT python_eval('import sys, ssl, sqlite3, json; return [sys.version.split()[0], sys.prefix]')" \
            -c "SELECT python_eval('return {\"sum\": args[\"a\"] + args[\"b\"]}', '{\"a\":2,\"b\":3}')" \
            | tee "$T/out.txt"
          grep -qi "${PKGNAME}.\{1,2\}python" "$T/out.txt" || { echo "PL/Python is not using the bundled runtime"; exit 1; }
          "$B/al_ctl" -D "$T/data" -m fast -w stop

      # ---- Build: Windows (MSYS2 shell) -------------------------------------
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          meson setup builddir \
            --prefix=/c/alohadb \
            -Drpath=true \
            -Dssl=openssl \
            -Dplpython=enabled

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ninja -C builddir -j$(nproc) -k 0

      - name: Stage & package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          DESTDIR="$PWD/stage" ninja -C builddir install
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="alohadb-${VERSION}-${{ matrix.platform }}"
          ROOT="$(dirname "$(dirname "$(find stage -name alohadb.exe | head -1)")")"
          mkdir -p dist
          cp -r "$ROOT" "dist/$NAME"
          P="dist/$NAME"
          # Python runtime for PL/Python: the MinGW standard library in
          # <install>/python/lib/pythonX.Y (found by plpy_main.c); its DLLs go to bin/.
          PYV=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          mkdir -p "$P/python/lib"
          cp -r "/mingw64/lib/python$PYV" "$P/python/lib/"
          PL="$P/python/lib/python$PYV"
          rm -rf "$PL"/test "$PL"/idlelib "$PL"/tkinter "$PL"/turtledemo "$PL"/lib-dynload/_tkinter*
          find "$PL/site-packages" -mindepth 1 -maxdepth 1 ! -name README.txt -exec rm -rf {} +
          find "$PL" -name __pycache__ -type d -prune -exec rm -rf {} +
          # Ship the MinGW runtime DLLs next to the executables: walk the import
          # tables (objdump; MSYS2 ldd cannot read some .pyd files) until no
          # new /mingw64/bin DLL turns up.
          queue=$(find "$P" -name '*.exe' -o -name '*.dll' -o -name '*.pyd')
          while [ -n "$queue" ]; do
            next=""
            for f in $queue; do
              for d in $(objdump -p "$f" | awk '/DLL Name:/ {print $3}'); do
                [ -f "/mingw64/bin/$d" ] && [ ! -f "$P/bin/$d" ] || continue
                cp "/mingw64/bin/$d" "$P/bin/"
                next="$next $P/bin/$d"
              done
            done
            queue=$next
          done
          ls "$P/bin" | grep -ci '\.dll$'
          ARCHIVE="${NAME}.zip"
          (cd dist && zip -qr "../$ARCHIVE" "$NAME")
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "PKGNAME=$NAME" >> $GITHUB_ENV

      - name: Smoke-test package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          unzip -q "$ARCHIVE" -d "$T"
          B="$T/$PKGNAME/bin"
          # Only Windows system directories on PATH: every DLL must come from the package.
          export PATH="$B:/c/Windows/System32:/c/Windows"
          "$B/alohadb.exe" --version
          "$B/alsql.exe" --version
          "$B/alinitdb.exe" -D "$T/data" -A trust -U ci --no-instructions
          "$B/al_ctl.exe" -D "$T/data" -l "$T/server.log" -o "-p 54329" -w start || { cat "$T/server.log"; exit 1; }
          "$B/alsql.exe" -X -h localhost -p 54329 -U ci -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT version()" \
            -c "CREATE EXTENSION alohadb_pg19compat" \
            -c "CREATE EXTENSION alohadb_vector" \
            -c "SELECT '[3,4]'::vector <-> '[0,0]'::vector AS l2" \
            -c "CREATE EXTENSION alohadb_python CASCADE" \
            -c "SELECT python_eval('import sys, ssl, sqlite3, json; return [sys.version.split()[0], sys.prefix]')" \
            -c "SELECT python_eval('return {\"sum\": args[\"a\"] + args[\"b\"]}', '{\"a\":2,\"b\":3}')" \
            | /usr/bin/tee "$T/out.txt"
          /usr/bin/grep -qi "${PKGNAME}.\{1,2\}python" "$T/out.txt" || { echo "PL/Python is not using the bundled runtime"; exit 1; }
          "$B/al_ctl.exe" -D "$T/data" -m fast -w stop

      # ---- Artifacts (always) and GitHub Release (tags / publish=true) ------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true
